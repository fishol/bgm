<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>阿鱼音乐</title>
    <link rel="icon" href="./image/logo.png" type="image/png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="viewport-wrapper">
        <section class="cassette-player" aria-label="Music player">
            <header class="player-header">
                <a href="https://www.fishol.me" target="_blank" class="brand" id="brandLogoText">
                    <span class="brand-text">© Fish Online Studio</span>
                </a>
                <span class="now-playing" id="nowPlaying">Nothing</span>
                <span class="model" id="bgmGenBtn">Click to create BGM code</span>
            </header>

            <div class="player-body">
                <div class="controls-panel">
                    <div class="controls">
                        <button class="btn icon-btn" id="prevBtn" title="Previous" aria-label="Previous track">
                            <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                        </button>
                        <button class="btn icon-btn" id="playPauseBtn" title="Play/Pause" aria-label="Play or pause">
                            <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                            <svg class="icon-pause" viewBox="0 0 24 24" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                        </button>
                        <button class="btn icon-btn" id="nextBtn" title="Next" aria-label="Next track">
                            <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                        </button>
                    </div>
                    <div class="progress-section">
                        <input type="range" id="progressBar" value="0" min="0" max="100" step="0.1" aria-label="Playback progress">
                    </div>
                    <span class="time-display" id="timeDisplay">00:00 / 00:00</span>
                    <div class="volume-container">
                        <button class="vol-btn" id="muteBtn" title="Mute/Unmute" aria-label="Mute or unmute">
                            <svg class="icon-vol-on" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                            <svg class="icon-vol-mute" viewBox="0 0 24 24" style="display: none;"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
                        </button>
                        <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.77" aria-label="Volume control">
                    </div>
                </div>
            </div>

            <div class="playlist-section">
                <div class="playlist-header">
                    <button id="addFieldsBtn" class="add-row-btn" title="Add input field" aria-label="Add track row">+</button>
                    <div class="playlist-columns-title">
                        <span class="col-title-name">Music Title</span>
                        <span class="col-title-link">Music Link</span>
                    </div>
                </div>
                <div id="trackList" class="track-list"></div>
            </div>
        </section>
    </main>

    <div class="dialog-overlay hidden" id="dialogOverlay" role="dialog" aria-modal="true" aria-label="Notification">
        <div class="dialog-box">
            <div class="dialog-message" id="dialogMessage"></div>
            <div class="dialog-actions">
                <button class="dialog-btn" id="dialogCloseBtn">OK</button>
            </div>
        </div>
    </div>

    <audio id="audioPlayer" preload="auto"></audio>
    <script src="script.js"></script>
</body>
</html>
