<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fishol Music Player</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="player">

    <h1>🎵 Fishol Music</h1>


    <div id="songName">
        未播放
    </div>


    <audio id="audio"></audio>


    <input 
    type="range" 
    id="progress"
    value="0"
    >


    <div class="controls">

        <button id="prev">
            ⏮
        </button>


        <button id="play">
            ▶
        </button>


        <button id="next">
            ⏭
        </button>


    </div>


    <div class="volume">

        🔊

        <input 
        type="range"
        id="volume"
        min="0"
        max="1"
        step="0.01"
        value="0.8">

    </div>



    <h3>
        播放列表
    </h3>


    <ul id="playlist">

    </ul>



</div>


<script src="player.js"></script>


</body>

</html>
